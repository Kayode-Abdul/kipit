<svg viewBox="0 0 600 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA95E"/>
      <stop offset="55%" stop-color="#F0700C"/>
      <stop offset="100%" stop-color="#C74804"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon badge -->
  <g transform="translate(14, 14)" filter="url(#softShadow)">
    <rect x="0" y="0" width="112" height="112" rx="28" fill="url(#badgeGrad)"/>

    <!-- refined ghost bag, subtler and more precise -->
    <g opacity="0.28">
      <path d="M52 36 V28 a12 12 0 0 1 24 -2.5" stroke="#F0700C" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M43 36 H85 L81.5 76 a6.5 6.5 0 0 1 -6.5 5.5 H54 a6.5 6.5 0 0 1 -6.5 -5.5 Z" fill="#F0700C"/>
    </g>

    <!-- main bag, refined proportions, slimmer stroke, tighter curves -->
    <path d="M36 27 V33.5 a13 13 0 0 1 26 -3.5" stroke="#FFFFFF" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M24 38 H72 L67.5 86 a7 7 0 0 1 -7 6 H38.5 a7 7 0 0 1 -7 -6 Z" fill="url(#orangeGrad)"/>

    <!-- fine fold line -->
    <path d="M26 44 L34 50 H62 L70 44" stroke="#C74804" stroke-width="1.4" opacity="0.45" fill="none"/>

    <!-- refined tag notch, thinner and more precise -->
    <path d="M35 60 L57 60 L46 80 Z" fill="#141414"/>
    <circle cx="46" cy="60" r="3.2" fill="#141414"/>
  </g>

  <!-- thin vertical divider for a premium feel -->
  <rect x="144" y="30" width="1" height="52" fill="#D8D8D8"/>

  <!-- Wordmark, tighter letter spacing, refined weight -->
  <text x="164" y="79" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#1A1A1A">kipit<tspan fill="#C74804">pos</tspan></text>
  <text x="166" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" letter-spacing="3.5" fill="#9A9A9A">POINT OF SALE</text>
</svg>
